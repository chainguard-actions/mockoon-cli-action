name: Test custom port - mockoon-cli action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mockoon data file
        run: |
          cat > /tmp/mockoon-data.json << 'EOF'
          {
            "uuid": "d7e9f1a3-b5c7-4d9e-1f3a-b5c7d9e1f3a5",
            "lastMigration": 32,
            "name": "Test API Custom Port",
            "endpointPrefix": "",
            "latency": 0,
            "port": 4000,
            "hostname": "",
            "routes": [
              {
                "uuid": "e8f0a2b4-c6d8-4e0f-2a4b-c6d8e0f2a4b6",
                "documentation": "",
                "method": "get",
                "endpoint": "ping",
                "responses": [
                  {
                    "uuid": "f9a1b3c5-d7e9-4f1a-3b5c-d7e9f1a3b5c7",
                    "body": "{\"message\": \"pong\"}",
                    "latency": 0,
                    "statusCode": 200,
                    "label": "",
                    "headers": [
                      {
                        "key": "Content-Type",
                        "value": "application/json"
                      }
                    ],
                    "filePath": "",
                    "sendFileAsBody": false,
                    "rules": [],
                    "rulesOperator": "OR",
                    "disableTemplating": false,
                    "fallbackTo404": false,
                    "default": true
                  }
                ],
                "enabled": true,
                "randomResponse": false,
                "sequentialResponse": false
              }
            ],
            "proxyMode": false,
            "proxyHost": "",
            "proxyRemovePrefix": false,
            "tlsOptions": {
              "enabled": false,
              "type": "CERT",
              "pfxPath": "",
              "certPath": "",
              "keyPath": "",
              "caPath": "",
              "passphrase": ""
            },
            "cors": true,
            "headers": [],
            "proxyReqHeaders": [],
            "proxyResHeaders": [],
            "data": [],
            "folders": [],
            "rootChildren": [
              {
                "type": "route",
                "uuid": "e8f0a2b4-c6d8-4e0f-2a4b-c6d8e0f2a4b6"
              }
            ]
          }
          EOF

      - id: action
        uses: .
        with:
          version: "latest"
          data-file: /tmp/mockoon-data.json
          port: "4000"

      - name: Wait for server to start
        run: sleep 5

      - name: Assert server is responding on custom port
        run: |
          echo "Checking if mockoon server is running on port 4000..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/ping || echo "000")
          echo "HTTP status code: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "FAIL: expected HTTP 200 from mock server on port 4000, got $RESPONSE"
            exit 1
          fi
          echo "PASS: mock server responded with 200 on custom port 4000"

      - name: Assert server is NOT on default port
        run: |
          echo "Checking that mockoon server is NOT on default port 3000..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ping 2>/dev/null || echo "000")
          echo "HTTP status code on port 3000: $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "FAIL: server should not be running on port 3000"
            exit 1
          fi
          echo "PASS: server is not on default port 3000"
