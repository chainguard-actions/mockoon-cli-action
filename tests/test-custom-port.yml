name: Test custom port
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Mockoon CLI action on custom port
        uses: .
        with:
          version: "latest"
          data-file: "./tests/fixtures/mockoon-data.json"
          port: "8080"

      - name: Wait for server to be ready on port 8080
        run: |
          echo "Waiting for Mockoon server to start on port 8080..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/hello > /dev/null 2>&1; then
              echo "Server is up after $i attempts"
              break
            fi
            echo "Attempt $i: server not ready yet, waiting..."
            sleep 2
          done

      - name: Assert server responds on custom port 8080
        run: |
          RESPONSE=$(curl -sf http://localhost:8080/hello)
          echo "actual response: $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: expected a response from Mockoon server on port 8080 but got nothing"
            exit 1
          fi
          echo "PASS: server responded on port 8080"

      - name: Assert default port 3000 is NOT listening
        run: |
          if curl -sf http://localhost:3000/hello > /dev/null 2>&1; then
            echo "FAIL: port 3000 should not be listening when custom port 8080 was specified"
            exit 1
          fi
          echo "PASS: port 3000 is not listening as expected"
