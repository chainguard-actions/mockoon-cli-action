name: "mockoon-cli"
description: "Run Mockoon CLI as a GitHub Action"
branding:
  color: "white"
inputs:
  version:
    description: "Mockoon CLI version to pull from NPM"
    required: true
    default: "latest"
  data-file:
    description: "Mockoon CLI data file (local file or URL, can be multiple, space separated, e.g., 'file1.json file2.json')"
    required: true
  port:
    description: "Mockoon CLI port (can be multiple, space separated, e.g., '3000 4000')"
    required: true
    default: "3000"
  extra-args:
    description: "Extra arguments to pass to Mockoon CLI (e.g., '--faker-locale en_GB --disable-routes users --env-vars-prefix MY_PREFIX_')"
    required: false
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: "Run Mockoon CLI"
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_DATA_FILE: ${{ inputs.data-file }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
      # use & to run in background for >4.0.0
      run: |
        # Validate version: only allow characters valid in npm versions/dist-tags
        # (alphanumeric, dots, hyphens, underscores, and semver range chars ^ ~ > < = * +)
        if ! printf '%s' "$INPUT_VERSION" | grep -qE '^[a-zA-Z0-9._+\-^~<>=*]+$'; then
          echo "Error: Invalid version string: '$INPUT_VERSION'" >&2
          exit 1
        fi
        npm install -g "@mockoon/cli@$INPUT_VERSION"

        data_files=()
        if [ -n "$INPUT_DATA_FILE" ]; then
          while IFS= read -r -d '' t; do data_files+=("$t"); done \
            < <(printf '%s' "$INPUT_DATA_FILE" | xargs printf '%s\0')
        fi

        ports=()
        if [ -n "$INPUT_PORT" ]; then
          while IFS= read -r -d '' t; do ports+=("$t"); done \
            < <(printf '%s' "$INPUT_PORT" | xargs printf '%s\0')
        fi

        extra_args=()
        if [ -n "$INPUT_EXTRA_ARGS" ]; then
          while IFS= read -r -d '' t; do extra_args+=("$t"); done \
            < <(printf '%s' "$INPUT_EXTRA_ARGS" | xargs printf '%s\0')
        fi

        mockoon-cli start --data "${data_files[@]}" --port "${ports[@]}" "${extra_args[@]}" &
